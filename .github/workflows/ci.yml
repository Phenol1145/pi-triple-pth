name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # professional 垂直用例依赖本地预置工具链容器（v13-asm-toolchain/Lean/QE/CP2K），
      # CI runner 不预置这些环境——排除 .integration 垂直切片；本地全量回归仍跑全部。
      - run: npm test -- --exclude 'test/pth-professional/*.integration.test.ts'
