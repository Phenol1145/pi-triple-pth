# P5：jupyter 单容器双面（pth services up jupyter）
# 环境变量：PTH_WORKSPACES_HOST（workspaces 宿主绝对路径）、
#           JUPYTER_SERVICE_TOKEN（南面 Bearer——与 engine compose 注入同值）
services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-triple-jupyter:dev
    container_name: pi-triple-jupyter-jupyter-1
    ports:
      - "127.0.0.1:8888:8888"   # 北面：只绑回环；浏览器/内置终端经宿主访问
    environment:
      - JUPYTER_SERVICE_TOKEN=${JUPYTER_SERVICE_TOKEN:?JUPYTER_SERVICE_TOKEN must be set}
      - JUPYTER_SOUTH_PORT=8889
      - PTH_HOST_PTH_ENTRY=${PTH_HOST_PTH_ENTRY:-}
      # 北向 kernel provider → engine API（token 需与 engine redis auth:token 同值）
      - PTH_API=${PTH_API:-http://pi-platform:3000}
      - JUPYTER_ENGINE_TOKEN=${JUPYTER_ENGINE_TOKEN:-}
      - JUPYTER_ENGINE_LANG=${JUPYTER_ENGINE_LANG:-python}
    volumes:
      - ${PTH_WORKSPACES_HOST:?PTH_WORKSPACES_HOST must be set}:/data/workspaces
      # pth CLI 轻量透传：宿主 pth 依赖树只读挂载（缺省空目录 = Lab 终端 pth 不可用，不阻塞服务）
      - ${PTH_HOST_PTH_ROOT:-/tmp/pth-host-empty}:/opt/pth-host:ro
    networks:
      - default
      - engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8889/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  default:
    name: pi-triple-jupyter_default
  engine:
    external: true
    name: pi-triple-pth_default
